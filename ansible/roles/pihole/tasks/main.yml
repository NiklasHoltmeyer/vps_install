---
- name: Pi-hole Verzeichnisse anlegen
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ pihole_dir }}"
    - "{{ pihole_config_dir }}"

- name: Pi-hole Compose-Datei erstellen
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ pihole_dir }}/compose.yaml"
    mode: "0600"

- name: Pi-hole starten
  community.docker.docker_compose_v2:
    project_src: "{{ pihole_dir }}"
    state: present
    pull: missing
