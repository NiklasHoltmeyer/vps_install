---
- name: Traefik Verzeichnis anlegen
  ansible.builtin.file:
    path: "{{ traefik_dir }}"
    state: directory
    mode: "0755"

- name: Traefik Compose-Datei erstellen
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ traefik_dir }}/compose.yaml"
    mode: "0644"

- name: Traefik starten
  community.docker.docker_compose_v2:
    project_src: "{{ traefik_dir }}"
    state: present
    pull: missing
